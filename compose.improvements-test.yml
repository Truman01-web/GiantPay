name: giantpay-local-improvements
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: giantpay_test
      POSTGRES_PASSWORD: synthetic-local-only
      POSTGRES_DB: giantpay_improvements_test
    ports:
      - '127.0.0.1:55439:5432'
    tmpfs:
      - /var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:56389:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
