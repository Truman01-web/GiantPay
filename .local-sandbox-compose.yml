services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: giantpay_test
      POSTGRES_USER: giantpay_test
      POSTGRES_PASSWORD: giantpay_test_password
    ports: ['127.0.0.1:55432:5432']
    tmpfs: ['/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U giantpay_test -d giantpay_test']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--requirepass', 'giantpay_test_password']
    ports: ['127.0.0.1:56379:6379']
    tmpfs: ['/data']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'giantpay_test_password', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
