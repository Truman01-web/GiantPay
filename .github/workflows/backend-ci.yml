name: Backend CI

on:
  pull_request:
    paths: ['server/**','.github/workflows/backend-ci.yml','pnpm-lock.yaml','pnpm-workspace.yaml','package.json']
  push:
    paths: ['server/**','.github/workflows/backend-ci.yml','pnpm-lock.yaml','pnpm-workspace.yaml','package.json']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: giantpay_ci_test
          POSTGRES_USER: giantpay_ci_test
          POSTGRES_PASSWORD: ci_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U giantpay_ci_test -d giantpay_ci_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://giantpay_ci_test:ci_only_password@127.0.0.1:5432/giantpay_ci_test
      DATABASE_URL: postgresql://giantpay_ci_test:ci_only_password@127.0.0.1:5432/giantpay_ci_test
      NODE_ENV: test
      PASSWORD_PEPPER: ci-test-password-pepper-32-characters
      COOKIE_SECRET: ci-test-cookie-secret-32-characters
      FRONTEND_ORIGIN: http://127.0.0.1:5173
      PAYMENT_PROVIDER: sandbox
      SANDBOX_WEBHOOK_SECRET: ci-test-webhook-secret-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.17.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Verify migrations and repeat safety
        working-directory: server
        run: pnpm run db:verify-migrations
      - run: pnpm --dir server run typecheck
      - run: pnpm --dir server run test:ci
      - run: pnpm --dir server run openapi:validate
      - run: pnpm --dir server run build
      - name: Reject compiled tests
        working-directory: server
        run: node scripts/check-dist.mjs
      - name: Reject tracked secrets and generated artifacts
        shell: bash
        run: |
          ! git grep -nE 'gp_test_[A-Za-z0-9_-]{20,}|whsec_[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY'
          tracked_artifacts="$(git ls-files 'server/dist/**' 'server/coverage/**' 'server/.env')"
          if [[ -n "$tracked_artifacts" ]]; then
            echo "::error::Generated artifacts or environment files are tracked:"
            printf '%s\n' "$tracked_artifacts"
            exit 1
          fi
