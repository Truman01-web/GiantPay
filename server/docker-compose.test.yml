services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: giantpay_test
      POSTGRES_USER: giantpay_test
      POSTGRES_PASSWORD: giantpay_test_password
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U giantpay_test -d giantpay_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
