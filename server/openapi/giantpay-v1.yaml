openapi: 3.1.0
info:
  title: GiantPay API
  version: 0.1.0
  description: |
    Contract for the GiantPay backend foundation. Amounts are integer minor units. Sandbox only.
    Cookie-authenticated mutations require X-CSRF-Token; bearer API-key requests do not.
    Credentialed browser requests are accepted only from the configured CORS origin.
    Rate-limited responses include Retry-After, RateLimit-Limit, RateLimit-Remaining and RateLimit-Reset.
servers:
  - url: http://127.0.0.1:4000/v1
tags:
  - name: Authentication
  - name: Merchants
  - name: Payments
  - name: Payment links
  - name: Checkout
  - name: Provider webhooks
  - name: Refunds
  - name: Dashboard
  - name: Ledger
  - name: Developer API keys
  - name: Merchant webhooks
  - name: Reconciliation
  - name: Ledger integrity
  - name: Disputes
  - name: Platform disputes
  - name: Sandbox settlements
  - name: Operational reports
  - name: Audit evidence
  - name: Team access
  - name: Account security
  - name: Merchant support
  - name: Platform administration
  - name: Notifications
  - name: Platform notifications
paths:
  /notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: List the authenticated merchant user's in-app notifications
      parameters:
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses: { '200': { description: User-isolated notification page }, '401': { description: Authentication required }, '403': { description: Permission denied } }
  /notifications/unread-count:
    get:
      operationId: getNotificationUnreadCount
      tags: [Notifications]
      summary: Count the authenticated user's unread in-app notifications
      responses: { '200': { description: Unread count } }
  /notifications/preferences:
    get:
      operationId: getNotificationPreferences
      tags: [Notifications]
      summary: Get effective notification preferences and channel availability
      responses: { '200': { description: Effective preferences } }
    patch:
      operationId: updateNotificationPreference
      tags: [Notifications]
      summary: Update one versioned notification preference
      parameters: [{ in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [category, channel, enabled, expectedVersion], properties: { category: { type: string }, channel: { enum: [IN_APP, EMAIL, SMS] }, enabled: { type: boolean }, expectedVersion: { type: integer, minimum: 0 } } } } } }
      responses: { '200': { description: Updated preference; external delivery remains unavailable }, '409': { description: 'Mandatory policy, stale version, or idempotency conflict' } }
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [Notifications]
      summary: Idempotently mark an owned notification read
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }, { in: header, name: Idempotency-Key, required: true, schema: { type: string } }]
      responses: { '200': { description: Original or replayed read result }, '404': { description: Notification not found } }
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [Notifications]
      summary: Idempotently mark the authenticated user's notifications read
      parameters: [{ in: header, name: Idempotency-Key, required: true, schema: { type: string } }]
      responses: { '200': { description: Read count } }
  /platform/notifications:
    get:
      operationId: listPlatformNotifications
      tags: [Platform notifications]
      summary: List the authenticated platform staff user's notifications
      responses: { '200': { description: User-isolated platform inbox } }
  /platform/notifications/unread-count:
    get:
      operationId: getPlatformNotificationUnreadCount
      tags: [Platform notifications]
      summary: Count unread platform-staff notifications
      responses: { '200': { description: Unread count } }
  /platform/notifications/{id}/read:
    post:
      operationId: markPlatformNotificationRead
      tags: [Platform notifications]
      summary: Mark an owned platform notification read
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }, { in: header, name: Idempotency-Key, required: true, schema: { type: string } }]
      responses: { '200': { description: Read result }, '404': { description: Notification not found } }
  /platform/notifications/read-all:
    post:
      operationId: markAllPlatformNotificationsRead
      tags: [Platform notifications]
      summary: Mark all notifications for the authenticated platform user read
      parameters: [{ in: header, name: Idempotency-Key, required: true, schema: { type: string } }]
      responses: { '200': { description: Read count } }
  /platform/notification-deliveries:
    get:
      operationId: listNotificationDeliveries
      tags: [Platform notifications]
      summary: List redacted notification delivery operations
      responses: { '200': { description: Redacted delivery list } }
  /platform/notification-deliveries/{id}:
    get:
      operationId: getNotificationDelivery
      tags: [Platform notifications]
      summary: Get a redacted delivery operation
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses: { '200': { description: Redacted delivery }, '404': { description: Delivery not found } }
  /platform/notification-deliveries/{id}/retry:
    post:
      operationId: retryNotificationDelivery
      tags: [Platform notifications]
      summary: Request an authorized retry without bypassing disabled providers or active controls
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }, { in: header, name: Idempotency-Key, required: true, schema: { type: string } }]
      responses: { '200': { description: Retry accepted }, '409': { description: 'Provider disabled, stale state, or idempotency conflict' }, '503': { description: Notification processing is paused or control state cannot be verified } }
  /platform/notification-templates:
    get:
      operationId: listNotificationTemplates
      tags: [Platform notifications]
      summary: List controlled template metadata without rendered recipient content
      responses: { '200': { description: Template metadata } }
  /support/cases:
    get:
      operationId: listMerchantSupportCases
      tags: [Merchant support]
      summary: List the authenticated merchant's support cases
      security: [{ cookieSession: [] }]
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 160}, description: 'Case reference, subject, GiantPay transaction reference, merchant reference, or approved customer reference.'}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/SupportStatus'}}
        - {name: priority, in: query, schema: {$ref: '#/components/schemas/SupportPriority'}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: sort, in: query, schema: {type: string, enum: [updatedAt, createdAt], default: updatedAt}}
        - {name: direction, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses: {'200': {description: Tenant-scoped cases, content: {application/json: {schema: {$ref: '#/components/schemas/SupportCasePage'}}}}, '401': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
    post:
      operationId: createMerchantSupportCase
      tags: [Merchant support]
      summary: Create a sandbox support case and initial public message
      description: Requires support:write, CSRF, and Idempotency-Key. Do not include passwords, OTPs, secrets, or complete payment credentials.
      security: [{ cookieSession: [] }]
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateSupportCase'}}}}
      responses: {'201': {description: Durable case, content: {application/json: {schema: {$ref: '#/components/schemas/SupportCase'}}}}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /support/cases/{id}:
    get:
      operationId: getMerchantSupportCase
      tags: [Merchant support]
      summary: View a tenant-owned case and public messages; internal notes are never returned
      security: [{ cookieSession: [] }]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Public case view, content: {application/json: {schema: {$ref: '#/components/schemas/SupportCaseDetail'}}}}, '404': {$ref: '#/components/responses/Error'}}
  /support/cases/{id}/replies:
    post:
      operationId: createMerchantSupportReply
      tags: [Merchant support]
      summary: Add an idempotent public merchant reply
      security: [{ cookieSession: [] }]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: Idempotency-Key, in: header, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SupportMessageInput'}}}}
      responses: {'201': {description: Public reply}, '404': {$ref: '#/components/responses/Error'}}
  /support/cases/{id}/status:
    post:
      operationId: denyMerchantSupportStatusTransition
      tags: [Merchant support]
      summary: Deny merchant status transitions because closure and reopening are platform-controlled
      security: [{ cookieSession: [] }]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'403': {$ref: '#/components/responses/Error'}}
  /platform/support/cases:
    get:
      operationId: listPlatformSupportCases
      tags: [Platform administration]
      summary: List support cases across merchants with stable filtering
      description: Human platform session with platform.support.read only; API keys and merchant sessions are denied.
      security: [{ cookieSession: [] }]
      parameters:
        - {name: search, in: query, schema: {type: string, maxLength: 160}}
        - {name: merchantId, in: query, schema: {type: string}}
        - {name: assignedTo, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/SupportStatus'}}
        - {name: priority, in: query, schema: {$ref: '#/components/schemas/SupportPriority'}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses: {'200': {description: Redacted support cases, content: {application/json: {schema: {$ref: '#/components/schemas/SupportCasePage'}}}}, '403': {$ref: '#/components/responses/Error'}}
  /platform/support/assignees:
    get:
      operationId: listPlatformSupportAssignees
      tags: [Platform administration]
      summary: List active platform staff explicitly eligible for support assignment
      description: Requires platform.support.assign and returns only safe identifiers and display names.
      security: [{ cookieSession: [] }]
      responses: {'200': {description: Eligible support assignees}, '403': {$ref: '#/components/responses/Error'}}
  /platform/support/cases/{id}:
    get:
      operationId: getPlatformSupportCase
      tags: [Platform administration]
      summary: View public messages, private internal notes, and append-only history
      security: [{ cookieSession: [] }]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Authorized staff view with internal activity, content: {application/json: {schema: {$ref: '#/components/schemas/SupportCaseDetail'}}}}, '404': {$ref: '#/components/responses/Error'}}
  /platform/support/cases/{id}/replies:
    post:
      operationId: createPlatformSupportReply
      tags: [Platform administration]
      summary: Add an idempotent public staff reply
      security: [{ cookieSession: [] }]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: Idempotency-Key, in: header, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SupportMessageInput'}}}}
      responses: {'201': {description: Public reply}, '403': {$ref: '#/components/responses/Error'}}
  /platform/support/cases/{id}/internal-notes:
    post:
      operationId: createPlatformSupportInternalNote
      tags: [Platform administration]
      summary: Add an idempotent private staff note that is never merchant-visible
      security: [{ cookieSession: [] }]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: Idempotency-Key, in: header, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SupportMessageInput'}}}}
      responses: {'201': {description: Internal note recorded}, '403': {$ref: '#/components/responses/Error'}}
  /platform/support/cases/{id}/assign:
    post:
      operationId: assignPlatformSupportCase
      tags: [Platform administration]
      summary: Assign or reassign eligible active platform staff
      security: [{ cookieSession: [] }]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SupportAssignmentInput'}}}}
      responses: {'200': {description: Assignment recorded}, '409': {$ref: '#/components/responses/Error'}}
  /platform/support/cases/{id}/status:
    post:
      operationId: transitionPlatformSupportCase
      tags: [Platform administration]
      summary: Apply an explicit support lifecycle transition with a reason
      security: [{ cookieSession: [] }]
      description: Requires Idempotency-Key and expectedStatus. Identical retries replay the durable response; changed input conflicts. Includes resolution, closure, and reopening.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SupportStatusInput'}}}}
      responses: {'200': {description: Transition recorded}, '409': {$ref: '#/components/responses/Error'}}
  /platform/support/cases/{id}/priority:
    post:
      operationId: prioritizePlatformSupportCase
      tags: [Platform administration]
      summary: Change LOW, NORMAL, HIGH, or URGENT priority without implying an SLA
      security: [{ cookieSession: [] }]
      description: Requires Idempotency-Key and expectedPriority for exactly-one-winner concurrency.
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SupportPriorityInput'}}}}
      responses: {'200': {description: Priority history recorded}, '409': {$ref: '#/components/responses/Error'}}
  /platform/merchants:
    get:
      operationId: listPlatformMerchants
      tags: [Platform administration]
      summary: List privacy-aware merchant summaries
      security: [{ cookieSession: [] }]
      responses: {'200': {description: Merchant summaries}, '403': {$ref: '#/components/responses/Error'}}
  /platform/merchants/{id}:
    get:
      operationId: getPlatformMerchant
      tags: [Platform administration]
      summary: View masked merchant and operational summary data
      security: [{ cookieSession: [] }]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Redacted merchant detail}, '404': {$ref: '#/components/responses/Error'}}
  /platform/transactions:
    get:
      operationId: listPlatformTransactions
      tags: [Platform administration]
      summary: Search selected cross-merchant transaction fields without customer or credential data
      security: [{ cookieSession: [] }]
      responses: {'200': {description: Redacted transactions}, '403': {$ref: '#/components/responses/Error'}}
  /platform/refunds:
    get:
      operationId: listPlatformRefunds
      tags: [Platform administration]
      summary: Read refund operations without changing existing maker-checker decisions
      security: [{ cookieSession: [] }]
      responses: {'200': {description: Refund summaries}, '403': {$ref: '#/components/responses/Error'}}
  /platform/settlements:
    get:
      operationId: listPlatformSettlements
      tags: [Platform administration]
      summary: Read sandbox settlement evidence; no payout is executed
      security: [{ cookieSession: [] }]
      responses: {'200': {description: Sandbox-only settlement summaries}, '403': {$ref: '#/components/responses/Error'}}
  /platform/reconciliation/exceptions:
    get:
      operationId: listPlatformReconciliationExceptions
      tags: [Platform administration]
      summary: Read reconciliation exceptions without ledger mutation
      security: [{ cookieSession: [] }]
      responses: {'200': {description: Exception summaries}, '403': {$ref: '#/components/responses/Error'}}
  /platform/audit-events:
    get:
      operationId: listPlatformAuditEvents
      tags: [Platform administration]
      summary: Read redacted append-only audit evidence and audit the sensitive lookup
      security: [{ cookieSession: [] }]
      responses: {'200': {description: Redacted audit records}, '403': {$ref: '#/components/responses/Error'}}
  /platform/health:
    get:
      operationId: getPlatformHealth
      tags: [Platform administration]
      summary: Read dependency availability without configuration or infrastructure secrets
      security: [{ cookieSession: [] }]
      responses: {'200': {description: Safe dependency state}, '403': {$ref: '#/components/responses/Error'}}
  /developer/api-keys:
    get:
      tags: [Developer API keys]
      security: [{ cookieSession: [] }]
      operationId: listApiKeys
      responses: { '200': { description: Safe key metadata; never includes secrets } }
    post:
      tags: [Developer API keys]
      security: [{ cookieSession: [] }]
      operationId: createApiKey
      description: Creates a sandbox key. The complete secret appears in this response only.
      responses: { '201': { description: Created key and one-time secret }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /developer/api-keys/{id}:
    get:
      tags: [Developer API keys]
      security: [{ cookieSession: [] }]
      operationId: getApiKey
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Safe key metadata }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      tags: [Developer API keys]
      security: [{ cookieSession: [] }]
      operationId: revokeApiKey
      description: Revokes rather than deletes the credential.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Revoked key metadata }, '404': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /developer/webhooks:
    get:
      tags: [Merchant webhooks]
      security: [{ cookieSession: [] }]
      operationId: listMerchantWebhooks
      responses: { '200': { description: Merchant webhook endpoints with masked secrets } }
    post:
      tags: [Merchant webhooks]
      security: [{ cookieSession: [] }]
      operationId: createMerchantWebhook
      description: Creates an HTTPS endpoint and returns its signing secret once.
      responses: { '201': { description: Created endpoint and one-time signing secret }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /developer/webhooks/{id}:
    get:
      tags: [Merchant webhooks]
      security: [{ cookieSession: [] }]
      operationId: getMerchantWebhook
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Endpoint and recent delivery history }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      tags: [Merchant webhooks]
      security: [{ cookieSession: [] }]
      operationId: updateMerchantWebhook
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Updated endpoint }, '404': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /developer/webhooks/{id}/rotate-secret:
    post:
      tags: [Merchant webhooks]
      security: [{ cookieSession: [] }]
      operationId: rotateMerchantWebhookSecret
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Rotated one-time signing secret }, '404': { $ref: '#/components/responses/Error' } }
  /developer/webhook-deliveries/{id}/retry:
    post:
      tags: [Merchant webhooks]
      security: [{ cookieSession: [] }]
      operationId: retryMerchantWebhookDelivery
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Terminal failure requeued }, '404': { $ref: '#/components/responses/Error' } }
  /health:
    get:
      operationId: getHealth
      responses:
        '200': { description: Healthy }
        '503': { $ref: '#/components/responses/Error' }
  /health/live:
    get:
      operationId: getLiveness
      responses: { '200': { description: Process is alive } }
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200': { description: Database and essential workers are ready }
        '503': { description: A required dependency is unavailable }
  /platform/operations/overview:
    get:
      tags: [Platform operations]
      security: [{ cookieSession: [] }]
      operationId: getOperationalOverview
      responses: { '200': { description: Redacted operational counts }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /platform/operations/metrics:
    get:
      tags: [Platform operations]
      security: [{ cookieSession: [] }]
      operationId: getOperationalMetrics
      responses: { '200': { description: Private low-cardinality metrics }, '403': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /platform/operations/incidents:
    get:
      tags: [Platform operations]
      security: [{ cookieSession: [] }]
      operationId: listOperationalIncidents
      parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Incident list }, '403': { $ref: '#/components/responses/Error' } }
    post:
      tags: [Platform operations]
      security: [{ cookieSession: [] }]
      operationId: createOperationalIncident
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Incident declared }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /platform/operations/incidents/{id}:
    get:
      tags: [Platform operations]
      security: [{ cookieSession: [] }]
      operationId: getOperationalIncident
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Incident detail }, '404': { $ref: '#/components/responses/Error' } }
  /platform/operations/incidents/{id}/notes:
    post:
      tags: [Platform operations]
      security: [{ cookieSession: [] }]
      operationId: addOperationalIncidentNote
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Note added }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /platform/operations/incidents/{id}/assign:
    post:
      tags: [Platform operations]
      security: [{ cookieSession: [] }]
      operationId: assignOperationalIncident
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Commander assigned }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /platform/operations/incidents/{id}/status:
    post:
      tags: [Platform operations]
      security: [{ cookieSession: [] }]
      operationId: changeOperationalIncidentStatus
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: State changed }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /platform/operations/incidents/{id}/severity:
    post:
      tags: [Platform operations]
      security: [{ cookieSession: [] }]
      operationId: changeOperationalIncidentSeverity
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Severity changed }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /platform/operations/controls:
    get:
      tags: [Platform operations]
      security: [{ cookieSession: [] }]
      operationId: listOperationalControls
      responses: { '200': { description: Effective controls }, '403': { $ref: '#/components/responses/Error' } }
  /platform/operations/controls/{key}:
    get:
      tags: [Platform operations]
      security: [{ cookieSession: [] }]
      operationId: getOperationalControl
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses: { '200': { description: Effective control }, '404': { $ref: '#/components/responses/Error' } }
  /platform/operations/controls/{key}/proposals:
    post:
      tags: [Platform operations]
      security: [{ cookieSession: [] }]
      operationId: proposeOperationalControl
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses: { '201': { description: Control proposed }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /platform/operations/control-proposals/{id}/approve:
    post:
      tags: [Platform operations]
      security: [{ cookieSession: [] }]
      operationId: approveOperationalControl
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
