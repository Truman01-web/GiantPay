  /webhooks/providers/sandbox:
    post:
      tags: [Provider webhooks]
      operationId: receiveSandboxProviderWebhook
      description: |
        Sandbox-only signed provider callback. Compute a lowercase hexadecimal HMAC-SHA256
        over `<X-GiantPay-Timestamp>.<raw request body>` using `SANDBOX_WEBHOOK_SECRET`.
        The timestamp is Unix seconds and must be within the configured tolerance. Valid
        duplicate events are acknowledged without repeating state changes. Event-ID reuse
        with a different payload is rejected as suspicious. An approved webhook-processing
        pause is enforced before payload processing; unverifiable control state fails closed.
      parameters:
        - name: X-GiantPay-Timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]{10}$' }
        - name: X-GiantPay-Signature
          in: header
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SandboxWebhookEvent' }
      responses:
        '202':
          description: Accepted or safely acknowledged as a duplicate
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicate]
                properties:
                  accepted: { const: true }
                  duplicate: { type: boolean }
        '503': { description: Webhook processing is paused or control state cannot be verified }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
