      tags: [Reconciliation]
      security: [{ cookieSession: [] }]
      description: Valid transitions are OPEN, UNDER_REVIEW, RESOLVED and DISMISSED; terminal transitions require reason and evidence.
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Idempotent transition accepted }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /reconciliation/exceptions/{id}/adjustments:
    post:
      operationId: submitCompensatingAdjustment
      tags: [Reconciliation]
      security: [{ cookieSession: [] }]
      description: Submits an append-only compensating adjustment for independent approval.
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Adjustment awaiting approval }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /reconciliation/adjustments/{id}/approve:
    post:
      operationId: approveCompensatingAdjustment
      tags: [Reconciliation]
      security: [{ cookieSession: [] }]
      description: Requires a checker different from the creator and posts a compensating reversal.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Approved append-only adjustment }, '409': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /reconciliation/adjustments/{id}/reject:
    post:
      operationId: rejectCompensatingAdjustment
      tags: [Reconciliation]
      security: [{ cookieSession: [] }]
      description: An independent checker rejects the proposal without changing the ledger.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Rejected adjustment }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /ledger/integrity:
    get:
      operationId: verifyLedgerIntegrity
      tags: [Ledger integrity]
      security: [{ cookieSession: [] }]
      description: Read-only merchant-scoped verification; never modifies ledger history.
      responses: { '200': { description: Integrity result and evidence }, '403': { $ref: '#/components/responses/Error' } }
  /settlements:
    get:
      operationId: listSandboxSettlements
      tags: [Sandbox settlements]
      security: [{ cookieSession: [] }]
      responses: { '200': { description: Paginated merchant sandbox settlements } }
    post:
      operationId: createSandboxSettlement
      tags: [Sandbox settlements]
      security: [{ cookieSession: [] }]
      description: Creates a sandbox-only calculation for an exception-free reconciliation; no payout occurs.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { description: Draft sandbox settlement }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /settlements/{id}:
    get:
      operationId: getSandboxSettlement
      tags: [Sandbox settlements]
      security: [{ cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Sandbox settlement with externalTransferExecuted false }, '404': { $ref: '#/components/responses/Error' } }
  /settlements/{id}/submit:
    post:
      operationId: submitSandboxSettlement
      tags: [Sandbox settlements]
      security: [{ cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Awaiting independent approval }, '409': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /settlements/{id}/approve:
    post:
      operationId: approveSandboxSettlement
      tags: [Sandbox settlements]
      security: [{ cookieSession: [] }]
      description: Maker-checker approval; creator cannot approve.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Approved sandbox calculation }, '409': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /settlements/{id}/cancel:
    post:
      operationId: cancelSandboxSettlement
      tags: [Sandbox settlements]
      security: [{ cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Cancelled without deleting history }, '409': { $ref: '#/components/responses/Error' } }
  /settlements/{id}/export:
    post:
      operationId: exportSandboxSettlement
      tags: [Sandbox settlements]
      security: [{ cookieSession: [] }]
      description: Produces a formula-safe sandbox CSV and audit record. It does not execute a transfer.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Deterministic sandbox CSV }, '409': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } }
  /reports/summary:
    get:
      tags: [Operational reports]
      operationId: getOperationalReportSummary
      security: [{ cookieSession: [] }, { bearerAuth: [] }]
      description: Tenant- and currency-scoped sandbox operational totals. Periods are UTC, must be positive, and cannot exceed 93 days. Amounts are integer minor-unit strings. These records are not bank, provider, tax, or regulatory statements.
      parameters:
        - { name: reportType, in: query, required: true, schema: { $ref: '#/components/schemas/ReportType' } }
        - { name: currency, in: query, required: true, schema: { type: string, enum: [MWK, USD] } }
        - { name: periodStart, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: periodEnd, in: query, required: true, schema: { type: string, format: date-time } }
      responses: { '200': { description: Sandbox operational summary }, '403': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /report-exports:
    get:
      tags: [Operational reports]
      operationId: listOperationalReportExports
      security: [{ cookieSession: [] }, { bearerAuth: [] }]
      description: Lists only the authenticated merchant's exports with bounded pagination.
      responses: { '200': { description: Tenant-scoped export page } }
    post:
      tags: [Operational reports]
      operationId: createOperationalReportExport
      security: [{ cookieSession: [] }]
      description: Creates a completed deterministic CSV sandbox record. Browser-session actors with reports:export only. Idempotency-Key is required; identical retries return the durable export, changed payloads conflict. Maximum 93 days and 10000 rows; results are never truncated. Stable errors include UNSUPPORTED_REPORT_TYPE, UNSUPPORTED_CURRENCY, INVALID_REPORTING_PERIOD, REPORTING_RANGE_EXCEEDED, REPORT_ROW_LIMIT_EXCEEDED, REPORT_IDEMPOTENCY_CONFLICT, and REPORT_EXPORT_GENERATION_FAILED.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportType, currency, periodStart, periodEnd]
              properties:
                reportType: { $ref: '#/components/schemas/ReportType' }
                currency: { type: string, enum: [MWK, USD] }
                periodStart: { type: string, format: date-time }
                periodEnd: { type: string, format: date-time }
      responses: { '201': { description: Durable immutable sandbox export }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /report-exports/{id}:
    get:
      tags: [Operational reports]
      operationId: getOperationalReportExport
      security: [{ cookieSession: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: Export metadata and SHA-256 hashes }, '404': { $ref: '#/components/responses/Error' } }
  /report-exports/{id}/download:
    get:
      tags: [Operational reports]
      operationId: downloadOperationalReportExport
      security: [{ cookieSession: [] }, { bearerAuth: [] }]
      description: Downloads deterministic formula-neutralized CSV and records one audit event per successful download. Cross-merchant requests return 404.
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: GiantPay sandbox operational CSV; not a bank, provider, tax, or regulatory statement
          headers:
            Content-Disposition: { schema: { type: string }, description: Sanitized report-type and opaque-export-ID filename }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content: { text/csv: { schema: { type: string } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /audit-events:
    get:
      tags: [Audit evidence]
      operationId: listMerchantAuditEvents
      security: [{ cookieSession: [] }]
      description: Browser-session-only, tenant-scoped append-only operational evidence. Metadata is recursively stripped of credentials, secrets, authorization data, and internal errors.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: action, in: query, schema: { type: string } }
        - { name: resourceType, in: query, schema: { type: string } }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: periodStart, in: query, schema: { type: string, format: date-time } }
        - { name: periodEnd, in: query, schema: { type: string, format: date-time } }
      responses: { '200': { description: Tenant-scoped audit page }, '403': { $ref: '#/components/responses/Error' } }
  /team/members:
    get: { tags: [Team access], operationId: listTeamMembers, security: [{ cookieSession: [] }], description: Tenant-scoped members; requires team:read and rejects API keys., responses: { '200': { description: Bounded member page }, '403': { $ref: '#/components/responses/Error' } } }
  /team/members/{id}:
    get: { tags: [Team access], operationId: getTeamMember, security: [{ cookieSession: [] }], parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Safe member metadata }, '404': { $ref: '#/components/responses/Error' } } }
  /team/members/{id}/role:
    patch: { tags: [Team access], operationId: changeTeamMemberRole, security: [{ cookieSession: [] }], description: Requires team:manage; final-owner protection is transactional., parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Role changed }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /team/members/{id}/suspend:
    post: { tags: [Team access], operationId: suspendTeamMember, security: [{ cookieSession: [] }], description: Revokes all sessions and protects the final owner., parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Suspended }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /team/members/{id}/reactivate:
    post: { tags: [Team access], operationId: reactivateTeamMember, security: [{ cookieSession: [] }], parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Reactivated }, '404': { $ref: '#/components/responses/Error' } } }
  /team/members/{id}/remove:
    post: { tags: [Team access], operationId: removeTeamMember, security: [{ cookieSession: [] }], description: Removes merchant access without deleting financial or audit records., parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Removed }, '409': { $ref: '#/components/responses/Error' } } }
  /team/invitations:
    get: { tags: [Team access], operationId: listTeamInvitations, security: [{ cookieSession: [] }], responses: { '200': { description: Pending tenant invitations without token hashes } } }
    post: { tags: [Team access], operationId: createTeamInvitation, security: [{ cookieSession: [] }], description: Creates a 72-hour hashed invitation and encrypted sandbox outbox delivery. Development and test responses may expose one-time delivery material; production responses never do., responses: { '201': { description: Safe invitation metadata }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /team/invitations/{id}/cancel:
    post: { tags: [Team access], operationId: cancelTeamInvitation, security: [{ cookieSession: [] }], parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Durably cancelled }, '404': { $ref: '#/components/responses/Error' } } }
  /team/invitations/{id}/resend:
    post: { tags: [Team access], operationId: resendTeamInvitation, security: [{ cookieSession: [] }], description: "Rotates the token hash, refreshes the 72-hour expiry, and queues one encrypted delivery. Production responses never expose the token.", parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Safe rotated invitation metadata }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /team/invitations/accept:
    post: { tags: [Team access], operationId: acceptTeamInvitation, description: "Atomically validates a hashed single-use token and normalized email identity, activates membership, and assigns the role.", responses: { '200': { description: Invitation accepted }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '410': { $ref: '#/components/responses/Error' } } }
  /roles:
    get: { tags: [Team access], operationId: listMerchantRoles, security: [{ cookieSession: [] }], responses: { '200': { description: Current database-backed roles and explicit permissions } } }
    post: { tags: [Team access], operationId: createMerchantRole, security: [{ cookieSession: [] }], description: Unknown permissions and permission escalation are rejected., responses: { '201': { description: Custom role }, '422': { $ref: '#/components/responses/Error' } } }
  /roles/{id}:
    patch: { tags: [Team access], operationId: updateMerchantRole, security: [{ cookieSession: [] }], description: Updates a locked custom role; system roles are protected., parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Updated role }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /roles/{id}/archive:
    post: { tags: [Team access], operationId: archiveMerchantRole, security: [{ cookieSession: [] }], description: Archives an unassigned custom role; system and assigned roles are protected., parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Archived }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /security/mfa/enrollment:
    post: { tags: [Account security], operationId: beginMfaEnrollment, security: [{ cookieSession: [] }], description: Returns an authenticator secret once; only encrypted secret material is stored., responses: { '200': { description: Controlled enrollment material }, '429': { $ref: '#/components/responses/TooManyRequests' } } }
  /auth/mfa/recovery:
    post: { tags: [Account security], operationId: completeMfaWithRecoveryCode, description: Consumes one hashed recovery code under a row lock and completes one valid login challenge., responses: { '200': { description: Authenticated session }, '401': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } } }
  /security/mfa/enrollment/verify:
    post: { tags: [Account security], operationId: verifyMfaEnrollment, security: [{ cookieSession: [] }], description: Activates TOTP and returns recovery codes once., responses: { '200': { description: One-time recovery codes }, '401': { $ref: '#/components/responses/Error' } } }
  /security/mfa/recovery-codes/regenerate:
    post: { tags: [Account security], operationId: regenerateRecoveryCodes, security: [{ cookieSession: [] }], description: Invalidates all prior codes and requires MFA within ten minutes., responses: { '200': { description: New one-time codes }, '403': { $ref: '#/components/responses/Error' } } }
  /security/mfa/disable:
    post: { tags: [Account security], operationId: disableMfa, security: [{ cookieSession: [] }], description: Requires MFA verification within ten minutes., responses: { '200': { description: MFA disabled }, '403': { $ref: '#/components/responses/Error' } } }
  /security/mfa/step-up:
    post: { tags: [Account security], operationId: verifyMfaStepUp, security: [{ cookieSession: [] }], description: Verifies TOTP or a recovery factor for only the current human session; success is valid for ten minutes., responses: { '200': { description: Recent MFA recorded }, '401': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } } }
  /sessions:
    get: { tags: [Account security], operationId: listOwnSessions, security: [{ cookieSession: [] }], description: Returns opaque IDs and safe timestamps only., responses: { '200': { description: Active sessions } } }
  /sessions/{id}:
    delete: { tags: [Account security], operationId: revokeOwnSession, security: [{ cookieSession: [] }], parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Session revoked }, '404': { $ref: '#/components/responses/Error' } } }
  /sessions/revoke-others:
    post: { tags: [Account security], operationId: revokeOtherSessions, security: [{ cookieSession: [] }], responses: { '200': { description: All sessions except current revoked } } }
  /disputes:
    get: { tags: [Disputes], operationId: listMerchantDisputes, security: [{ cookieSession: [] }, { sandboxApiKey: [] }], description: Tenant-scoped sandbox dispute records with deterministic created-at and ID cursors., parameters: [{ $ref: '#/components/parameters/DisputeCursor' }, { $ref: '#/components/parameters/DisputeLimit' }], responses: { '200': { description: Merchant dispute page }, '403': { $ref: '#/components/responses/Error' } } }
  /disputes/{id}:
    get: { tags: [Disputes], operationId: getMerchantDispute, security: [{ cookieSession: [] }, { sandboxApiKey: [] }], parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Merchant-safe dispute projection }, '404': { $ref: '#/components/responses/Error' } } }
  /disputes/{id}/responses:
    post: { tags: [Disputes], operationId: addMerchantDisputeResponse, security: [{ cookieSession: [] }, { sandboxApiKey: [] }], parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DisputeResponseInput' } } } }, responses: { '201': { description: Append-only public response }, '409': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } } }
  /disputes/{id}/evidence:
    post: { tags: [Disputes], operationId: addMerchantDisputeEvidence, security: [{ cookieSession: [] }, { sandboxApiKey: [] }], description: Records sandbox metadata only; no binary upload or provider submission occurs., parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DisputeEvidenceInput' } } } }, responses: { '201': { description: Metadata-only evidence record }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } } }
  /platform/disputes:
    get: { tags: [Platform disputes], operationId: listPlatformDisputes, security: [{ cookieSession: [] }], parameters: [{ $ref: '#/components/parameters/DisputeCursor' }, { $ref: '#/components/parameters/DisputeLimit' }], responses: { '200': { description: Authorized platform dispute page }, '429': { $ref: '#/components/responses/TooManyRequests' } } }
    post: { tags: [Platform disputes], operationId: createPlatformDispute, security: [{ cookieSession: [] }], description: Records a sandbox operational dispute; it performs no provider call or fund movement., parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateDisputeInput' } } } }, responses: { '201': { description: Atomic sandbox dispute record }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/TooManyRequests' } } }
  /platform/disputes/{id}:
    get: { tags: [Platform disputes], operationId: getPlatformDispute, security: [{ cookieSession: [] }], parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { description: Authorized staff projection including internal notes and histories }, '404': { $ref: '#/components/responses/Error' } } }
  /platform/disputes/{id}/responses:
    post: { tags: [Platform disputes], operationId: addPlatformDisputeResponse, security: [{ cookieSession: [] }], parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DisputeResponseInput' } } } }, responses: { '201': { description: Append-only public staff response }, '409': { $ref: '#/components/responses/Error' } } }
  /platform/disputes/{id}/internal-notes:
    post: { tags: [Platform disputes], operationId: addDisputeInternalNote, security: [{ cookieSession: [] }], description: Body is platform-private and excluded from audit and outbox metadata., parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DisputeResponseInput' } } } }, responses: { '201': { description: Private append-only note } } }
  /platform/disputes/{id}/request-information:
    post: { tags: [Platform disputes], operationId: requestDisputeInformation, security: [{ cookieSession: [] }], parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DisputeExpectedStateInput' } } } }, responses: { '200': { description: Information requested }, '409': { $ref: '#/components/responses/Error' } } }
  /platform/disputes/{id}/assign:
    post: { tags: [Platform disputes], operationId: assignDispute, security: [{ cookieSession: [] }], parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Expected-state assignment }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
  /platform/disputes/{id}/status:
    post: { tags: [Platform disputes], operationId: changeDisputeStatus, security: [{ cookieSession: [] }], parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DisputeExpectedStateInput' } } } }, responses: { '200': { description: Allowed expected-state transition }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }
  /platform/disputes/{id}/decisions:
    post: { tags: [Platform disputes], operationId: mutateDisputeDecision, security: [{ cookieSession: [] }], description: Proposes or independently reviews a terminal sandbox decision. Financial effects remain pending instructions and cause no payout., parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Independently reviewed decision }, '201': { description: Decision proposal }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } } }
components:
  securitySchemes:
    cookieSession: { type: apiKey, in: cookie, name: giantpay_session }
    sandboxApiKey: { type: http, scheme: bearer, bearerFormat: gp_test_<identifier>_<secret> }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize:
      {
        name: pageSize,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
      }
    DisputeCursor: { name: cursor, in: query, schema: { type: string }, description: ISO timestamp and stable ID separated by a vertical bar. }
    DisputeLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 8, maxLength: 128 },
      }
    From: { name: from, in: query, required: true, schema: { type: string, format: date-time } }
    To: { name: to, in: query, required: true, schema: { type: string, format: date-time } }
  requestBodies:
    Token:
      required: true
      content:
        {
          application/json:
            {
              schema: { type: object, required: [token], properties: { token: { type: string } } },
            },
        }
  responses:
    TooManyRequests:
      description: The applicable IP, identity, user, merchant, or API-key bucket is exhausted
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
        RateLimit-Limit: { schema: { type: integer, minimum: 1 } }
        RateLimit-Remaining: { schema: { type: integer, minimum: 0 } }
        RateLimit-Reset: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Error:
      description: Normalized error response
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    SupportStatus: {type: string, enum: [OPEN, IN_PROGRESS, WAITING_ON_MERCHANT, WAITING_FOR_INTERNAL, ESCALATED, RESOLVED, CLOSED]}
    SupportPriority: {type: string, enum: [LOW, NORMAL, HIGH, URGENT]}
    SupportCategory: {type: string, enum: [ACCOUNT, ONBOARDING, PAYMENT, REFUND, SETTLEMENT, RECONCILIATION, API_INTEGRATION, WEBHOOK, SECURITY, OTHER]}
    SupportMessageInput: {type: object, additionalProperties: false, required: [message], properties: {message: {type: string, minLength: 1, maxLength: 10000}}}
    CreateSupportCase:
      type: object
      additionalProperties: false
      required: [category, subject, message]
      properties: {category: {$ref: '#/components/schemas/SupportCategory'}, subject: {type: string, minLength: 3, maxLength: 160}, message: {type: string, minLength: 1, maxLength: 10000}, transactionId: {type: string}}
    SupportAssignmentInput: {type: object, additionalProperties: false, required: [staffId, reason], properties: {staffId: {type: string}, expectedAssigneeId: {type: [string, 'null']}, reason: {type: string, minLength: 3, maxLength: 1000}}}
    SupportStatusInput: {type: object, additionalProperties: false, required: [status, expectedStatus, reason], properties: {status: {$ref: '#/components/schemas/SupportStatus'}, expectedStatus: {$ref: '#/components/schemas/SupportStatus'}, reason: {type: string, minLength: 3, maxLength: 1000, description: Required resolution summary when status is RESOLVED.}}}
    SupportPriorityInput: {type: object, additionalProperties: false, required: [priority, expectedPriority, reason], properties: {priority: {$ref: '#/components/schemas/SupportPriority'}, expectedPriority: {$ref: '#/components/schemas/SupportPriority'}, reason: {type: string, minLength: 3, maxLength: 1000}}}
    SupportCase:
      type: object
      required: [id, reference, merchantId, category, subject, status, priority, createdAt, updatedAt]
      properties:
        id: {type: string}
        reference: {type: string}
        merchantId: {type: string}
        category: {$ref: '#/components/schemas/SupportCategory'}
        subject: {type: string}
        status: {$ref: '#/components/schemas/SupportStatus'}
        priority: {$ref: '#/components/schemas/SupportPriority'}
        assignedOwner: {type: [object, 'null'], additionalProperties: false, properties: {id: {type: string}, name: {type: string}}}
        linkedTransaction: {type: [object, 'null'], additionalProperties: false, properties: {id: {type: string}, reference: {type: string}, merchantReference: {type: [string, 'null']}, status: {type: string}}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        escalatedAt: {type: [string, 'null'], format: date-time}
        resolvedAt: {type: [string, 'null'], format: date-time}
        closedAt: {type: [string, 'null'], format: date-time}
        resolutionSummary: {type: [string, 'null']}
    SupportActivity:
      type: object
      required: [id, type, visibility, actorId, body, createdAt]
      properties: {id: {type: string}, type: {type: string, enum: [MESSAGE, NOTE, STATUS, ASSIGNMENT, PRIORITY]}, visibility: {type: string, enum: [MERCHANT, INTERNAL]}, actorId: {type: string}, body: {type: string}, from: {type: [string, 'null']}, to: {type: [string, 'null']}, createdAt: {type: string, format: date-time}}
    SupportCaseDetail:
      allOf:
        - {$ref: '#/components/schemas/SupportCase'}
        - {type: object, required: [description, timeline], properties: {description: {type: string}, timeline: {type: array, items: {$ref: '#/components/schemas/SupportActivity'}}}}
    SupportCasePage: {type: object, required: [data, total, nextCursor], properties: {data: {type: array, items: {$ref: '#/components/schemas/SupportCase'}}, total: {type: integer, minimum: 0}, nextCursor: {type: [string, 'null']}}}
    CreateDisputeInput:
      type: object
      required: [paymentId, source, reasonCategory, amountMinor, currency, summary]
      properties: { paymentId: { type: string }, transactionId: { type: string }, externalReference: { type: string }, source: { type: string, enum: [SANDBOX, MERCHANT_REPORTED, PLATFORM_REPORTED, PROVIDER_REPORTED] }, reasonCategory: { type: string, enum: [FRAUDULENT, DUPLICATE, PRODUCT_NOT_RECEIVED, SERVICE_NOT_PROVIDED, NOT_AS_DESCRIBED, CREDIT_NOT_PROCESSED, INCORRECT_AMOUNT, PROCESSING_ERROR, OTHER] }, amountMinor: { type: integer, minimum: 1 }, currency: { type: string, pattern: '^[A-Z]{3}$' }, summary: { type: string, minLength: 3, maxLength: 1000 }, responseDeadline: { type: string, format: date-time } }
    DisputeResponseInput: { type: object, required: [body], properties: { body: { type: string, minLength: 1, maxLength: 10000 } } }
    DisputeEvidenceInput:
      type: object
      required: [evidenceType, description, originalFilename, mimeType, fileSize, checksumSha256]
      properties: { evidenceType: { type: string }, description: { type: string }, originalFilename: { type: string }, mimeType: { type: string, enum: [application/pdf, image/png, image/jpeg, text/plain] }, fileSize: { type: integer, minimum: 1, maximum: 10485760 }, checksumSha256: { type: string, pattern: '^[0-9a-f]{64}$' } }
    DisputeExpectedStateInput: { type: object, required: [reason, expectedStatus, expectedVersion], properties: { reason: { type: string, minLength: 3 }, expectedStatus: { type: string, enum: [OPEN, NEEDS_MERCHANT_RESPONSE, MERCHANT_RESPONDED, UNDER_REVIEW, ACCEPTED, CONTESTED, WON, LOST, CLOSED] }, expectedVersion: { type: integer, minimum: 1 } } }
    ReportType:
      type: string
      enum: [TRANSACTION_ACTIVITY, REFUND_ACTIVITY, PLATFORM_FEES, MERCHANT_LEDGER, RECONCILIATION_RESULTS, SANDBOX_SETTLEMENT_SUMMARIES]
    Accepted: { type: object, required: [accepted], properties: { accepted: { const: true } } }
    Money:
      {
        type: object,
        required: [amountMinor, currency],
        properties:
          { amountMinor: { type: integer }, currency: { type: string, pattern: '^[A-Z]{3}$' } },
      }
    RegisterRequest:
      type: object
      required: [businessName, email, password, phone]
      properties:
        {
          businessName: { type: string },
          email: { type: string, format: email },
          password: { type: string, minLength: 12 },
          phone: { type: string, pattern: '^\\+265[0-9]{9}$' },
        }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        {
          email: { type: string, format: email },
          password: { type: string },
          remember: { type: boolean },
        }
    CreatePaymentLink:
      type: object
      required: [name, mode, currency, reusable]
      properties:
        {
          name: { type: string },
          mode: { enum: [FIXED, CUSTOMER_ENTERED] },
          amountMinor: { type: integer, minimum: 1 },
          currency: { type: string },
          description: { type: string },
          customerReference: { type: string },
          expiresAt: { type: string, format: date-time },
          reusable: { type: boolean },
          maxSuccessfulPayments: { type: integer, minimum: 1 },
          redirectUrl: { type: string, format: uri },
        }
    CheckoutSubmit:
      type: object
      required: [channel, customer]
      properties:
        channel: { enum: [MOBILE_MONEY, CARD, BANK_TRANSFER] }
        customer:
          type: object
          required: [name, phone]
          properties:
            {
              name: { type: string },
              email: { type: string, format: email },
              phone: { type: string, pattern: '^\\+265[0-9]{9}$' },
            }
    CreateRefund:
      type: object
      required: [paymentId, amountMinor, reason]
      properties:
        {
          paymentId: { type: string },
          amountMinor: { type: integer, minimum: 1 },
          reason: { type: string },
        }
    SandboxWebhookEvent:
      type: object
      additionalProperties: false
      required: [eventId, eventType, paymentReference, providerPaymentId, status, occurredAt]
      properties:
        eventId: { type: string, maxLength: 200 }
        eventType: { const: payment.status.changed }
        paymentReference: { type: string, maxLength: 200 }
        providerPaymentId: { type: string, maxLength: 200 }
        status:
          {
            enum:
              [
                CREATED,
                PROCESSING,
                PENDING,
                SUCCEEDED,
                FAILED,
                EXPIRED,
                CANCELLED,
                REFUND_PENDING,
                PARTIALLY_REFUNDED,
                REFUNDED,
              ],
          }
        occurredAt: { type: string, format: date-time }
    Payment:
      type: object
      required: [id, reference, status, gross, fee, tax, net, customer, createdAt, updatedAt]
      properties:
        {
          id: { type: string },
          reference: { type: string },
          status: { type: string },
          gross: { $ref: '#/components/schemas/Money' },
          fee: { $ref: '#/components/schemas/Money' },
          tax: { $ref: '#/components/schemas/Money' },
          net: { $ref: '#/components/schemas/Money' },
          customer: { type: object },
          createdAt: { type: string, format: date-time },
          updatedAt: { type: string, format: date-time },
        }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            {
              code: { type: string },
              message: { type: string },
              requestId: { type: string },
              fields: { type: object, additionalProperties: { type: string } },
            }
