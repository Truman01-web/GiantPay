limit_req_zone $binary_remote_addr zone=giantpay_api:10m rate=20r/s;
upstream giantpay_api { server 127.0.0.1:4000; keepalive 32; }
server {
  listen 443 ssl http2;
  server_name api.giantpay.mw;
  ssl_certificate /etc/letsencrypt/live/api.giantpay.mw/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.giantpay.mw/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 11m;
  location / {
    limit_req zone=giantpay_api burst=40 nodelay;
    proxy_pass http://giantpay_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
  }
}
